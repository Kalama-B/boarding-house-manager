const URL='https://lorzxjtmssdecnrqjepp.supabase.co'; const KEY='sb_publishable_gjWXkNRco47lrz3t9C0ZIg_qN-raceL';

const hdr=(extra={})=>({'apikey':KEY,'Authorization':'Bearer '+(session?.access_token||KEY),'Content-Type':'application/json',...extra});
async function api(path,opt={}){const r=await fetch(URL+path,{...opt,headers:hdr(opt.headers||{})});const t=await r.text();let d=t?JSON.parse(t):null;if(!r.ok)throw new Error(d?.message||d?.msg||d?.error_description||t||('HTTP '+r.status));return d}
const db={
 auth:{
  async signInWithPassword({email,password}){try{session=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});localStorage.setItem('bh_session',JSON.stringify(session));return {data:session,error:null}}catch(error){return {data:null,error}}},
  async signUp({email,password}){try{let data=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password})});if(data?.access_token){session=data;localStorage.setItem('bh_session',JSON.stringify(data))}return {data,error:null}}catch(error){return {data:null,error}}},
  async getUser(){if(!session?.access_token)return {data:{user:null}};try{let user=await api('/auth/v1/user');return {data:{user}}}catch(e){localStorage.removeItem('bh_session');session=null;return {data:{user:null}}}},
  async signOut(){try{if(session?.access_token)await api('/auth/v1/logout',{method:'POST'})}catch(e){}localStorage.removeItem('bh_session');session=null}
 },
 from(table){return new Query(table)},
 async rpc(fn,args){try{return {data:await api('/rest/v1/rpc/'+fn,{method:'POST',body:JSON.stringify(args)}),error:null}}catch(error){return {data:null,error}}}
};
class Query{
 constructor(t){this.t=t;this.q=[];this.method='GET';this.body=null;this.wantSingle=false;this.headers={};}
 select(cols='*'){if(this.method==='POST'||this.method==='PATCH'){this.headers.Prefer='return=representation'}else this.q.push('select='+encodeURIComponent(cols));return this}
 eq(k,v){this.q.push(encodeURIComponent(k)+'=eq.'+encodeURIComponent(v));return this}
 order(k,o={}){this.q.push('order='+encodeURIComponent(k)+'.'+(o.ascending===false?'desc':'asc'));return this}
 limit(n){this.q.push('limit='+n);return this}
 maybeSingle(){this.wantSingle=true;return this}
 single(){this.wantSingle=true;return this}
 insert(body){this.method='POST';this.body=body;this.headers.Prefer='return=representation';return this}
 update(body){this.method='PATCH';this.body=body;this.headers.Prefer='return=representation';return this}
 then(resolve,reject){let path='/rest/v1/'+this.t+(this.q.length?'?'+this.q.join('&'):'');api(path,{method:this.method,body:this.body?JSON.stringify(this.body):undefined,headers:this.headers}).then(d=>{if(this.wantSingle)d=Array.isArray(d)?(d[0]||null):d;resolve({data:d,error:null})}).catch(error=>resolve({data:null,error}))}
}let user=null,userRole='viewer',property=null,rooms=[],occs=[],charges=[],payments=[],allocs=[],tab='rooms',modal='',month=new Date().toISOString().slice(0,7);const $=s=>document.querySelector(s);const money=n=>(property?.currency||'K')+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const first=m=>m+'-01';const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function authView(msg=''){app.innerHTML=`<main class="auth"><div class="card"><h2>Uniquarters Apartments</h2><p class="mut">Staff sign in</p>${msg?`<p class="err">${esc(msg)}</p>`:''}<label>Email</label><input id="email" type="email"><label>Password</label><input id="pass" type="password" style="margin-bottom:10px"><div class="actions"><button class="p" onclick="signin()">Sign in</button><button onclick="customerPortal()">View & book available rooms</button></div></div></main>`}
window.signin=async function signin(){const {error}=await db.auth.signInWithPassword({email:email.value,password:pass.value});if(error)return authView(error.message);await boot()}
window.signup=async function signup(){const e=email.value,p=pass.value;if(!e||p.length<6)return authView('Enter an email and a password of at least 6 characters.');const {error}=await db.auth.signUp({email:e,password:p});if(error)return authView(error.message);authView('Account created. If email confirmation is enabled, confirm the email, then sign in.')}
async function boot(){const {data:{user:u}}=await db.auth.getUser();user=u;if(!u)return authView();const {data:pu,error}=await db.from('property_users').select('property_id,role').eq('user_id',u.id).limit(1).maybeSingle();if(error||!pu){return authView('Your account exists but is not yet assigned to this boarding house.')}const {data:p}=await db.from('properties').select('*').eq('id',pu.property_id).single();property=p;userRole=pu.role;await load();}
async function load(){const pid=property.id;await db.rpc('ensure_monthly_rent_charges',{p_month:first(month)});const [r,o,c,p,a]=await Promise.all([db.from('rooms').select('*').eq('property_id',pid).eq('is_active',true).order('room_number'),db.from('occupancies').select('*,tenants(*)').eq('property_id',pid),db.from('rent_charges').select('*').eq('property_id',pid),db.from('payments').select('*').eq('property_id',pid).order('payment_date',{ascending:false}),db.from('payment_allocations').select('*')]);rooms=r.data||[];occs=o.data||[];charges=c.data||[];payments=p.data||[];allocs=a.data||[];render()}
const currentOcc=room=>occs.find(o=>o.room_id===room.id&&!o.end_date);const chargeFor=(occ,m)=>charges.find(c=>c.occupancy_id===occ?.id&&c.charge_month===first(m));const allocatedTo=c=>allocs.filter(a=>a.charge_id===c?.id).reduce((s,a)=>s+Number(a.amount),0);const totalArrears=occ=>charges.filter(c=>c.occupancy_id===occ.id).reduce((s,c)=>s+Math.max(Number(c.amount)-allocatedTo(c),0),0);
window.render=function render(){let occupied=rooms.filter(r=>currentOcc(r)),expected=occupied.reduce((s,r)=>s+Number(currentOcc(r).agreed_rent),0),col=payments.filter(p=>p.payment_date.slice(0,7)===month).reduce((s,p)=>s+Number(p.amount),0),arr=occupied.reduce((s,r)=>s+totalArrears(currentOcc(r)),0);let h=`<main><div class="top"><h2>🏠 ${esc(property.name)}</h2><div><button onclick="moveMonth(-1)">‹</button> <b>${month}</b> <button onclick="moveMonth(1)">›</button> <button onclick="logout()">Sign out</button></div></div><div class="stats"><div class="st"><b>${occupied.length}/${rooms.length}</b><span>Occupied rooms</span></div><div class="st"><b>${money(expected)}</b><span>Current monthly rent</span></div><div class="st"><b>${money(col)}</b><span>Payments received this month</span></div><div class="st"><b>${money(arr)}</b><span>Total outstanding arrears</span></div></div><div class="tabs"><button onclick="tab='rooms';render()">Rooms</button><button onclick="tab='ledger';render()">Rent ledger</button><button onclick="tab='payments';render()">Payments</button><button onclick="openBookings()">Bookings</button>${userRole==='admin'?'<button onclick="openGallery()">Room photos</button><button onclick="openUsers()">Users</button>':''}</div>`;
if(tab==='rooms'){h+=`<div class="grid">`+rooms.map(r=>{let o=currentOcc(r),c=chargeFor(o,month),paid=allocatedTo(c),cls=!o?'':paid>=Number(c?.amount||0)&&c?'paid':paid>0?'part':'unpaid';return `<button class="room ${cls}" onclick="roomModal('${r.id}')"><b>Room ${r.room_number}</b><br><small>${o?esc(o.tenants.full_name):'Vacant'}</small><br><small>${o?money(paid)+' / '+money(c?.amount||o.agreed_rent):''}</small>${o&&totalArrears(o)>0?`<br><small>Arrears: ${money(totalArrears(o))}</small>`:''}</button>`}).join('')+`</div>`}
if(tab==='ledger'){h+=`<div class="card wrap"><table><tr><th>Room</th><th>Tenant</th><th>Month</th><th>Charge</th><th>Allocated</th><th>Balance</th><th>Due</th></tr>`+charges.slice().sort((a,b)=>b.charge_month.localeCompare(a.charge_month)).map(c=>{let o=occs.find(x=>x.id===c.occupancy_id),r=rooms.find(x=>x.id===o?.room_id),al=allocatedTo(c);return `<tr><td>${r?.room_number||''}</td><td>${esc(o?.tenants?.full_name||'')}</td><td>${c.charge_month.slice(0,7)}</td><td>${money(c.amount)}</td><td>${money(al)}</td><td>${money(Number(c.amount)-al)}</td><td>${c.due_date}</td></tr>`}).join('')+`</table></div>`}
if(tab==='payments'){h+=`<div class="card"><button class="p" onclick="paymentPicker()">+ Record payment</button></div><div class="card wrap"><table><tr><th>Date</th><th>Tenant</th><th>Amount</th><th>Method</th><th>Reference</th></tr>`+payments.map(p=>{let o=occs.find(x=>x.id===p.occupancy_id);return `<tr><td>${p.payment_date}</td><td>${esc(o?.tenants?.full_name||'')}</td><td>${money(p.amount)}</td><td>${esc(p.method)}</td><td>${esc(p.reference||'')}</td></tr>`}).join('')+`</table></div>`}h+=`</main>${modal}`;app.innerHTML=h}
window.roomModal=function roomModal(id){let r=rooms.find(x=>x.id===id),o=currentOcc(r);modal=`<div class="ov"><div class="md"><h3>Room ${r.room_number}</h3>${o?`<p><b>${esc(o.tenants.full_name)}</b><br>${esc(o.tenants.phone||'')}<br>Monthly rent: ${money(o.agreed_rent)}<br>Outstanding: <b>${money(totalArrears(o))}</b></p><button class="p" onclick="paymentModal('${o.id}')">Record payment</button> <button onclick="moveout('${o.id}')">Move out</button>`:`<label>Tenant name</label><input id="tn"><div class="row"><div><label>Phone</label><input id="tp"></div><div><label>Email</label><input id="te"></div></div><label>Monthly rent</label><input id="tr" type="number"><button class="p" onclick="addTenant('${r.id}')">Move tenant in</button>`} <button onclick="modal='';render()">Close</button></div></div>`;render()}
window.addTenant=async function addTenant(roomId){let name=tn.value.trim(),rent=+tr.value;if(!name||rent<0)return alert('Enter tenant name and monthly rent');let {data:t,error}=await db.from('tenants').insert({property_id:property.id,full_name:name,phone:tp.value,email:te.value}).select().single();if(error)return alert(error.message);let {error:e}=await db.from('occupancies').insert({property_id:property.id,room_id:roomId,tenant_id:t.id,agreed_rent:rent,start_date:new Date().toISOString().slice(0,10)});if(e)return alert(e.message);await db.from('rooms').update({monthly_rent:rent}).eq('id',roomId);modal='';await load()}
window.moveout=async function moveout(id){if(!confirm('Move this tenant out? Existing charges and payment history will be retained.'))return;await db.from('occupancies').update({end_date:new Date().toISOString().slice(0,10)}).eq('id',id);modal='';await load()}
window.paymentPicker=function paymentPicker(){let active=occs.filter(o=>!o.end_date);modal=`<div class="ov"><div class="md"><h3>Choose tenant</h3>`+active.map(o=>`<button style="display:block;width:100%;margin:5px 0" onclick="paymentModal('${o.id}')">${esc(o.tenants.full_name)} · Room ${rooms.find(r=>r.id===o.room_id)?.room_number}</button>`).join('')+`<button onclick="modal='';render()">Cancel</button></div></div>`;render()}
window.paymentModal=function paymentModal(id){let o=occs.find(x=>x.id===id);modal=`<div class="ov"><div class="md"><h3>Record payment · ${esc(o.tenants.full_name)}</h3><label>Amount</label><input id="pa" type="number"><div class="row"><div><label>Date</label><input id="pd" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Method</label><select id="pm"><option>Cash</option><option>Mobile money</option><option>Bank transfer</option><option>Other</option></select></div></div><label>Reference</label><input id="pr"><p class="mut">Payments are automatically allocated to the oldest unpaid rent first.</p><button class="p" onclick="savePayment('${id}')">Save payment</button> <button onclick="modal='';render()">Cancel</button></div></div>`;render()}
window.savePayment=async function savePayment(oid){let amt=+pa.value;if(!(amt>0))return alert('Enter an amount');let {data:p,error}=await db.from('payments').insert({property_id:property.id,occupancy_id:oid,payment_date:pd.value,amount:amt,method:pm.value,reference:pr.value,created_by:user.id}).select().single();if(error)return alert(error.message);await db.rpc('allocate_payment_oldest_first',{p_payment:p.id});await db.from('invoices').insert({property_id:property.id,payment_id:p.id});modal='';await load()}
window.moveMonth=async function moveMonth(d){let [y,m]=month.split('-').map(Number),x=new Date(y,m-1+d,1);month=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');await load()};window.logout=async function logout(){await db.auth.signOut();user=null;authView()}
window.openUsers=async function openUsers(){let {data,error}=await db.rpc('list_property_users',{});if(error)return alert(error.message);let rows=(data||[]).map(x=>`<tr><td>${esc(x.email||'')}</td><td>${esc(x.full_name||'')}</td><td>${esc(x.role)}</td><td>${x.user_id===user.id?'Current user':`<button onclick='editUser(${JSON.stringify(JSON.stringify(x))})'>Edit</button> <button onclick="deleteUser('${x.user_id}','${esc(x.email||'')}')">Delete</button>`}</td></tr>`).join('');modal=`<div class="ov"><div class="md"><h3>Users & access</h3><p class="mut">Create a login and assign its access level.</p><label>Full name</label><input id="un"><div class="row"><div><label>Email</label><input id="ue" type="email"></div><div><label>Password</label><input id="up" type="password" minlength="6"></div></div><label>Role</label><select id="ur"><option value="viewer">Regular user (view only)</option><option value="manager">Regular user (can edit)</option><option value="admin">Administrator</option></select><button class="p" style="margin-top:10px" onclick="createUser()">Create user</button><div class="wrap" style="margin-top:12px"><table><tr><th>Email</th><th>Name</th><th>Role</th><th>Actions</th></tr>${rows}</table></div><button onclick="modal='';render()">Close</button></div></div>`;render()};
window.createUser=async function createUser(){let name=un.value.trim(),email=ue.value.trim(),password=up.value,role=ur.value;if(!name||!email||password.length<6)return alert('Enter name, email and a password of at least 6 characters');try{let r=await fetch(URL+'/functions/v1/create-property-user',{method:'POST',headers:hdr(),body:JSON.stringify({full_name:name,email,password,role})});let d=await r.json();if(!r.ok)throw new Error(d.error||'Could not create user');alert('User created successfully');await openUsers()}catch(e){alert(e.message)}};

window.editUser=function editUser(raw){let x=JSON.parse(raw);modal=`<div class="ov"><div class="md"><h3>Edit user</h3><label>Full name</label><input id="en" value="${esc(x.full_name||'')}"><label>Email</label><input id="ee" type="email" value="${esc(x.email||'')}"><label>New password <span class="mut">(leave blank to keep current)</span></label><input id="ep" type="password"><label>Role</label><select id="er"><option value="viewer" ${x.role==='viewer'?'selected':''}>Regular user (view only)</option><option value="manager" ${x.role==='manager'?'selected':''}>Regular user (can edit)</option><option value="admin" ${x.role==='admin'?'selected':''}>Administrator</option></select><button class="p" onclick="saveUserEdit('${x.user_id}')">Save changes</button> <button onclick="openUsers()">Cancel</button></div></div>`;render()};
window.saveUserEdit=async function saveUserEdit(id){let body={action:'update',user_id:id,full_name:en.value.trim(),email:ee.value.trim(),password:ep.value,role:er.value};if(body.password&&body.password.length<6)return alert('Password must be at least 6 characters');let r=await fetch(URL+'/functions/v1/create-property-user',{method:'POST',headers:hdr(),body:JSON.stringify(body)}),d=await r.json();if(!r.ok)return alert(d.error||'Update failed');alert('User updated');await openUsers()};
window.deleteUser=async function deleteUser(id,email){if(!confirm('Delete '+email+'? This removes their login access.'))return;let r=await fetch(URL+'/functions/v1/create-property-user',{method:'POST',headers:hdr(),body:JSON.stringify({action:'delete',user_id:id})}),d=await r.json();if(!r.ok)return alert(d.error||'Delete failed');alert('User deleted');await openUsers()};
window.customerPortal=async function customerPortal(){let [rr,si,gg]=await Promise.all([db.rpc('public_available_rooms',{}),db.rpc('public_booking_payment_instructions',{}),db.rpc('public_room_gallery',{})]);let rs=rr.data||[],settings=(si.data||[])[0]||{},gallery=gg.data||[];let pics=gallery.length?`<div><h3 style="margin-bottom:8px">Our Rooms</h3><div style="display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;margin:0 0 18px;padding-bottom:6px">${gallery.map(g=>`<img src="${esc(g.image_url)}" alt="Uniquarters Apartments room" style="flex:0 0 88%;max-width:520px;height:250px;object-fit:cover;border-radius:12px;scroll-snap-align:start">`).join('')}</div></div>`:'';app.innerHTML=`<main><div class="top"><div><h2>Available Rooms</h2><p class="mut">Choose a room and submit your booking. Payment is required within ${settings.hold_hours||2} hours to confirm your slot.</p></div><button onclick="authView()">Staff sign in</button></div>${pics}<div class="grid">${rs.length?rs.map(r=>`<div class="card"><h3>Room ${esc(r.room_number)}</h3><p>${esc(r.room_type||'Room')}</p><p class="mut">${esc(r.description||'Available for booking')}</p><p><b>${'K'+Number(r.monthly_rent||0).toLocaleString()}</b> / month</p>${Number(r.deposit_amount)>0?`<p>Deposit: K${Number(r.deposit_amount).toLocaleString()}</p>`:''}<p class="mut">${esc(r.amenities||'')}</p><button class="p" onclick="publicBook('${r.id}','${esc(r.room_number)}',${Number(r.monthly_rent||0)},${Number(r.deposit_amount||0)})">Book room</button></div>`).join(''):'<div class="card"><b>No rooms are currently available for online booking.</b></div>'}</div></main>`};
window.publicBook=function publicBook(id,no,rent,dep){app.innerHTML=`<main class="auth"><div class="card"><h2>Book Room ${no}</h2><p>Rent: <b>K${rent.toLocaleString()}</b>${dep?'<br>Deposit: <b>K'+dep.toLocaleString()+'</b>':''}</p><label>Full name</label><input id="bn"><label>Phone number</label><input id="bp"><label>Email</label><input id="be" type="email"><p class="mut">Your booking is held for 2 hours while payment is awaiting verification.</p><button class="p" onclick="submitPublicBooking('${id}')">Submit booking</button> <button onclick="customerPortal()">Back</button></div></main>`};
window.submitPublicBooking=async function submitPublicBooking(room){let name=bn.value.trim(),phone=bp.value.trim(),email=be.value.trim();if(!name||!phone||!email)return alert('Enter your name, phone number and email');let x=await db.rpc('create_public_booking',{p_room_id:room,p_customer_name:name,p_phone:phone,p_email:email});if(x.error)return alert(x.error.message);let b=(x.data||[])[0],s=await db.rpc('public_booking_payment_instructions',{}),z=(s.data||[])[0]||{};app.innerHTML=`<main class="auth"><div class="card"><h2>Booking received</h2><p>Your booking reference is <b>${esc(b.booking_reference)}</b>.</p><p>Amount required to confirm: <b>K${Number(b.amount_due).toLocaleString()}</b></p><p><b>Pay within ${z.hold_hours||2} hours:</b></p><p><b>MTN MoMo:</b> ${esc(z.mtn_number||'')} — ${esc(z.mtn_name||'')}<br><b>Airtel Money:</b> ${esc(z.airtel_number||'')} — ${esc(z.airtel_name||'')}</p><p>Send Proof of Payment quoting <b>${esc(b.booking_reference)}</b> to:<br><b>Email:</b> ${esc(z.pop_email||'')}<br><b>WhatsApp:</b> ${esc(z.pop_whatsapp||'')}</p><p class="mut">The room is temporarily held. Your booking becomes confirmed after payment is verified.</p><button class="p" onclick="customerPortal()">View rooms</button></div></main>`};
window.openBookings=async function openBookings(){let q=await db.from('bookings').select('*').eq('property_id',property.id).order('created_at',{ascending:false});if(q.error)return alert(q.error.message);let bs=q.data||[];modal=`<div class="ov"><div class="md" style="width:min(850px,100%)"><h3>Bookings</h3><div class="wrap"><table><tr><th>Reference</th><th>Customer</th><th>Room</th><th>Due</th><th>Paid</th><th>Status</th><th>Action</th></tr>${bs.map(b=>{let r=rooms.find(x=>x.id===b.room_id);return `<tr><td>${esc(b.booking_reference)}</td><td>${esc(b.customer_name)}<br><small>${esc(b.phone)}</small></td><td>${esc(r?.room_number||'')}</td><td>${money(b.amount_due)}</td><td>${money(b.amount_paid)}</td><td>${esc(b.status)}</td><td>${b.status==='pending_payment'?`<button onclick="confirmBookingPrompt('${b.id}',${Number(b.amount_due)-Number(b.amount_paid)})">Confirm payment</button>`:''} ${Number(b.amount_paid)>0?`<button onclick="refundBookingPrompt('${b.id}',${Number(b.amount_paid)})">Refund</button>`:''}</td></tr>`}).join('')}</table></div><button onclick="modal='';render()">Close</button></div></div>`;render()};
window.refundBookingPrompt=function refundBookingPrompt(id,paid){modal=`<div class="ov"><div class="md"><h3>Refund booking payment</h3><p>Currently recorded as paid: <b>${money(paid)}</b></p><label>Refund amount</label><input id="rfa" type="number" min="0.01" max="${paid}" value="${paid}"><label>Refund method</label><select id="rfm"><option>MTN MoMo</option><option>Airtel Money</option><option>Cash</option><option>Bank transfer</option><option>Other</option></select><label>Refund reference</label><input id="rfr"><label>Reason</label><input id="rfreason" placeholder="e.g. Customer changed their mind"><label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input id="rfcancel" type="checkbox" style="width:auto"> Cancel booking and release room if fully refunded</label><button class="p" onclick="refundBooking('${id}')">Record refund</button> <button onclick="openBookings()">Back</button></div></div>`;render()};window.refundBooking=async function refundBooking(id){let amount=+rfa.value;if(!(amount>0))return alert('Enter refund amount');if(!confirm('Record refund of '+money(amount)+'?'))return;let x=await db.rpc('refund_booking_payment',{p_booking:id,p_amount:amount,p_method:rfm.value,p_reference:rfr.value,p_reason:rfreason.value,p_cancel:rfcancel.checked});if(x.error)return alert(x.error.message);alert('Refund recorded and balances updated');modal='';await load();await openBookings()};
window.confirmBookingPrompt=function confirmBookingPrompt(id,due){modal=`<div class="ov"><div class="md"><h3>Confirm booking payment</h3><label>Amount received</label><input id="cba" type="number" value="${due}" oninput="toggleExcess(${due})"><div id="cbex" style="display:none"><label>Amount above current balance — what should happen to the excess?</label><select id="cbea"><option value="next_month">Apply as part payment / advance to next month</option><option value="refund">Refund the excess</option></select></div><label>Method</label><select id="cbm"><option>MTN MoMo</option><option>Airtel Money</option><option>Cash</option><option>Bank transfer</option><option>Other</option></select><label>Transaction / POP reference</label><input id="cbr"><button class="p" onclick="confirmBooking('${id}',${due})">Confirm payment</button> <button onclick="openBookings()">Cancel</button></div></div>`;render()};window.toggleExcess=function toggleExcess(due){let a=+cba.value;cbex.style.display=a>due?'block':'none'};
window.confirmBooking=async function confirmBooking(id,due){let amount=+cba.value;if(!(amount>0))return alert('Enter amount received');let action=amount>due?cbea.value:null;let x=await db.rpc('confirm_booking_payment',{p_booking:id,p_amount:amount,p_method:cbm.value,p_reference:cbr.value,p_excess_action:action});if(x.error)return alert(x.error.message);alert(amount>due?(action==='next_month'?'Payment recorded. Current balance settled and excess applied to next month.':'Payment recorded. Current balance settled and excess marked for refund.'):'Payment recorded and booking updated');modal='';await load();await openBookings()};
window.openGallery=async function openGallery(){let g=await db.rpc('public_room_gallery',{}),pics=g.data||[];modal=`<div class="ov"><div class="md"><h3>Shared room photos</h3><p class="mut">The rooms are identical, so these representative photos will be shown for every available room.</p><label>Choose photos from your phone</label><input id="gfiles" type="file" accept="image/*" multiple><label>Caption <span class="mut">(optional)</span></label><input id="gcap" placeholder="e.g. Standard room interior"><button class="p" style="margin-top:8px" onclick="uploadGalleryPhotos()">Upload photos</button><div style="margin-top:12px">${pics.map(x=>`<div class="card" style="margin:6px 0"><img src="${esc(x.image_url)}" alt="Room photo" style="width:100%;max-height:220px;object-fit:cover;border-radius:8px"><p>${esc(x.caption||'')}</p><button onclick="deleteGalleryPhoto('${x.id}','${encodeURIComponent(x.image_url)}')">Remove</button></div>`).join('')||'<p class="mut">No room photos added yet.</p>'}</div><button onclick="modal='';render()">Close</button></div></div>`;render()};
window.uploadGalleryPhotos=async function uploadGalleryPhotos(){let fs=[...(gfiles.files||[])];if(!fs.length)return alert('Choose at least one photo');let cap=gcap.value.trim();let btn=document.querySelector('[onclick="uploadGalleryPhotos()"]');if(btn){btn.disabled=true;btn.textContent='Uploading 0 / '+fs.length}for(let i=0;i<fs.length;i++){let file=fs[i];if(file.size>10485760){if(btn)btn.disabled=false;return alert(file.name+' is larger than 10 MB')}let form=new FormData();form.append('file',file);form.append('caption',cap);try{let r=await fetch(URL+'/functions/v1/upload-room-photo',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+session.access_token},body:form});let t=await r.text(),d={};try{d=t?JSON.parse(t):{}}catch(e){}if(!r.ok)throw new Error(d.error||t||'Upload failed');if(btn)btn.textContent='Uploading '+(i+1)+' / '+fs.length}catch(e){if(btn){btn.disabled=false;btn.textContent='Upload photos'}return alert('Could not upload '+file.name+': '+e.message)}}alert(fs.length+' photo'+(fs.length===1?'':'s')+' uploaded successfully');await openGallery()};
window.deleteGalleryPhoto=async function deleteGalleryPhoto(id,encodedUrl){if(!confirm('Remove this room photo?'))return;try{let u=decodeURIComponent(encodedUrl),marker='/storage/v1/object/public/room-photos/',p=u.split(marker)[1];if(p)await fetch(URL+'/storage/v1/object/room-photos/'+p,{method:'DELETE',headers:hdr()});await api('/rest/v1/property_room_photos?id=eq.'+encodeURIComponent(id),{method:'DELETE'});await openGallery()}catch(e){alert(e.message)}};
boot();
</script></body></html>
