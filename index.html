<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boarding House Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2320;--mut:#6b746f;--line:#e2e0d8;--ok:#1f7a4d;--okb:#dff3e8;--wa:#9a6700;--wab:#fdf0cc;--bad:#b3261e;--badb:#fbe0dd;--vac:#eceae3;--acc:#1f4d3a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif}main{max-width:1080px;margin:auto;padding:16px}.top,.actions{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin:14px 0}.st,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.st b{display:block;font-size:21px}.st span,.mut{color:var(--mut);font-size:12px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px}.room{min-height:90px;text-align:left}.paid{background:var(--okb)}.part{background:var(--wab)}.unpaid{background:var(--badb)}button,input,select{font:inherit}button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;cursor:pointer}button.p{background:var(--acc);color:white;border-color:var(--acc)}input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:white}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.ov{position:fixed;inset:0;background:#0008;display:flex;justify-content:center;align-items:flex-start;padding:24px;overflow:auto}.md{width:min(560px,100%);background:white;border-radius:12px;padding:16px}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}.auth{max-width:430px;margin:10vh auto}.err{color:var(--bad)}@media(max-width:600px){.row{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><script>
const app=document.getElementById('app');
app.innerHTML='<main class="auth"><div class="card"><h2>Boarding House Manager</h2><p class="mut">Loading secure cloud application…</p></div></main>';
window.addEventListener('error',e=>{app.innerHTML='<main class="auth"><div class="card"><h2>Boarding House Manager</h2><p class="err">The application could not start: '+String(e.message||'Unknown browser error')+'</p><button onclick="location.reload()">Retry</button></div></main>'});
const URL='https://lorzxjtmssdecnrqjepp.supabase.co'; const KEY='sb_publishable_gjWXkNRco47lrz3t9C0ZIg_qN-raceL';
if(!window.supabase||!window.supabase.createClient){throw new Error('Secure database library did not load. Please refresh the page.')}\nconst db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});let user=null,property=null,rooms=[],occs=[],charges=[],payments=[],allocs=[],tab='rooms',modal='',month=new Date().toISOString().slice(0,7);const $=s=>document.querySelector(s);const money=n=>(property?.currency||'K')+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const first=m=>m+'-01';const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function authView(msg=''){app.innerHTML=`<main class="auth"><div class="card"><h2>Boarding House Manager</h2><p class="mut">Sign in to access the shared cloud database.</p>${msg?`<p class="err">${esc(msg)}</p>`:''}<label>Email</label><input id="email" type="email"><label>Password</label><input id="pass" type="password" style="margin-bottom:10px"><div class="actions"><button class="p" onclick="signin()">Sign in</button><button onclick="signup()">Create first account</button></div></div></main>`}
async function signin(){const {error}=await db.auth.signInWithPassword({email:email.value,password:pass.value});if(error)return authView(error.message);await boot()}
async function signup(){const e=email.value,p=pass.value;if(!e||p.length<6)return authView('Enter an email and a password of at least 6 characters.');const {error}=await db.auth.signUp({email:e,password:p});if(error)return authView(error.message);authView('Account created. If email confirmation is enabled, confirm the email, then sign in.')}
async function boot(){const {data:{user:u}}=await db.auth.getUser();user=u;if(!u)return authView();const {data:pu,error}=await db.from('property_users').select('property_id,role').eq('user_id',u.id).limit(1).maybeSingle();if(error||!pu){return authView('Your account exists but is not yet assigned to this boarding house.')}const {data:p}=await db.from('properties').select('*').eq('id',pu.property_id).single();property=p;await load();}
async function load(){const pid=property.id;await db.rpc('ensure_monthly_rent_charges',{p_month:first(month)});const [r,o,c,p,a]=await Promise.all([db.from('rooms').select('*').eq('property_id',pid).eq('is_active',true).order('room_number'),db.from('occupancies').select('*,tenants(*)').eq('property_id',pid),db.from('rent_charges').select('*').eq('property_id',pid),db.from('payments').select('*').eq('property_id',pid).order('payment_date',{ascending:false}),db.from('payment_allocations').select('*')]);rooms=r.data||[];occs=o.data||[];charges=c.data||[];payments=p.data||[];allocs=a.data||[];render()}
const currentOcc=room=>occs.find(o=>o.room_id===room.id&&!o.end_date);const chargeFor=(occ,m)=>charges.find(c=>c.occupancy_id===occ?.id&&c.charge_month===first(m));const allocatedTo=c=>allocs.filter(a=>a.charge_id===c?.id).reduce((s,a)=>s+Number(a.amount),0);const totalArrears=occ=>charges.filter(c=>c.occupancy_id===occ.id).reduce((s,c)=>s+Math.max(Number(c.amount)-allocatedTo(c),0),0);
function render(){let occupied=rooms.filter(r=>currentOcc(r)),expected=occupied.reduce((s,r)=>s+Number(currentOcc(r).agreed_rent),0),col=payments.filter(p=>p.payment_date.slice(0,7)===month).reduce((s,p)=>s+Number(p.amount),0),arr=occupied.reduce((s,r)=>s+totalArrears(currentOcc(r)),0);let h=`<main><div class="top"><h2>🏠 ${esc(property.name)}</h2><div><button onclick="moveMonth(-1)">‹</button> <b>${month}</b> <button onclick="moveMonth(1)">›</button> <button onclick="logout()">Sign out</button></div></div><div class="stats"><div class="st"><b>${occupied.length}/${rooms.length}</b><span>Occupied rooms</span></div><div class="st"><b>${money(expected)}</b><span>Current monthly rent</span></div><div class="st"><b>${money(col)}</b><span>Payments received this month</span></div><div class="st"><b>${money(arr)}</b><span>Total outstanding arrears</span></div></div><div class="tabs"><button onclick="tab='rooms';render()">Rooms</button><button onclick="tab='ledger';render()">Rent ledger</button><button onclick="tab='payments';render()">Payments</button></div>`;
if(tab==='rooms'){h+=`<div class="grid">`+rooms.map(r=>{let o=currentOcc(r),c=chargeFor(o,month),paid=allocatedTo(c),cls=!o?'':paid>=Number(c?.amount||0)&&c?'paid':paid>0?'part':'unpaid';return `<button class="room ${cls}" onclick="roomModal('${r.id}')"><b>Room ${r.room_number}</b><br><small>${o?esc(o.tenants.full_name):'Vacant'}</small><br><small>${o?money(paid)+' / '+money(c?.amount||o.agreed_rent):''}</small>${o&&totalArrears(o)>0?`<br><small>Arrears: ${money(totalArrears(o))}</small>`:''}</button>`}).join('')+`</div>`}
if(tab==='ledger'){h+=`<div class="card wrap"><table><tr><th>Room</th><th>Tenant</th><th>Month</th><th>Charge</th><th>Allocated</th><th>Balance</th><th>Due</th></tr>`+charges.slice().sort((a,b)=>b.charge_month.localeCompare(a.charge_month)).map(c=>{let o=occs.find(x=>x.id===c.occupancy_id),r=rooms.find(x=>x.id===o?.room_id),al=allocatedTo(c);return `<tr><td>${r?.room_number||''}</td><td>${esc(o?.tenants?.full_name||'')}</td><td>${c.charge_month.slice(0,7)}</td><td>${money(c.amount)}</td><td>${money(al)}</td><td>${money(Number(c.amount)-al)}</td><td>${c.due_date}</td></tr>`}).join('')+`</table></div>`}
if(tab==='payments'){h+=`<div class="card"><button class="p" onclick="paymentPicker()">+ Record payment</button></div><div class="card wrap"><table><tr><th>Date</th><th>Tenant</th><th>Amount</th><th>Method</th><th>Reference</th></tr>`+payments.map(p=>{let o=occs.find(x=>x.id===p.occupancy_id);return `<tr><td>${p.payment_date}</td><td>${esc(o?.tenants?.full_name||'')}</td><td>${money(p.amount)}</td><td>${esc(p.method)}</td><td>${esc(p.reference||'')}</td></tr>`}).join('')+`</table></div>`}h+=`</main>${modal}`;app.innerHTML=h}
function roomModal(id){let r=rooms.find(x=>x.id===id),o=currentOcc(r);modal=`<div class="ov"><div class="md"><h3>Room ${r.room_number}</h3>${o?`<p><b>${esc(o.tenants.full_name)}</b><br>${esc(o.tenants.phone||'')}<br>Monthly rent: ${money(o.agreed_rent)}<br>Outstanding: <b>${money(totalArrears(o))}</b></p><button class="p" onclick="paymentModal('${o.id}')">Record payment</button> <button onclick="moveout('${o.id}')">Move out</button>`:`<label>Tenant name</label><input id="tn"><div class="row"><div><label>Phone</label><input id="tp"></div><div><label>Email</label><input id="te"></div></div><label>Monthly rent</label><input id="tr" type="number"><button class="p" onclick="addTenant('${r.id}')">Move tenant in</button>`} <button onclick="modal='';render()">Close</button></div></div>`;render()}
async function addTenant(roomId){let name=tn.value.trim(),rent=+tr.value;if(!name||rent<0)return alert('Enter tenant name and monthly rent');let {data:t,error}=await db.from('tenants').insert({property_id:property.id,full_name:name,phone:tp.value,email:te.value}).select().single();if(error)return alert(error.message);let {error:e}=await db.from('occupancies').insert({property_id:property.id,room_id:roomId,tenant_id:t.id,agreed_rent:rent,start_date:new Date().toISOString().slice(0,10)});if(e)return alert(e.message);await db.from('rooms').update({monthly_rent:rent}).eq('id',roomId);modal='';await load()}
async function moveout(id){if(!confirm('Move this tenant out? Existing charges and payment history will be retained.'))return;await db.from('occupancies').update({end_date:new Date().toISOString().slice(0,10)}).eq('id',id);modal='';await load()}
function paymentPicker(){let active=occs.filter(o=>!o.end_date);modal=`<div class="ov"><div class="md"><h3>Choose tenant</h3>`+active.map(o=>`<button style="display:block;width:100%;margin:5px 0" onclick="paymentModal('${o.id}')">${esc(o.tenants.full_name)} · Room ${rooms.find(r=>r.id===o.room_id)?.room_number}</button>`).join('')+`<button onclick="modal='';render()">Cancel</button></div></div>`;render()}
function paymentModal(id){let o=occs.find(x=>x.id===id);modal=`<div class="ov"><div class="md"><h3>Record payment · ${esc(o.tenants.full_name)}</h3><label>Amount</label><input id="pa" type="number"><div class="row"><div><label>Date</label><input id="pd" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Method</label><select id="pm"><option>Cash</option><option>Mobile money</option><option>Bank transfer</option><option>Other</option></select></div></div><label>Reference</label><input id="pr"><p class="mut">Payments are automatically allocated to the oldest unpaid rent first.</p><button class="p" onclick="savePayment('${id}')">Save payment</button> <button onclick="modal='';render()">Cancel</button></div></div>`;render()}
async function savePayment(oid){let amt=+pa.value;if(!(amt>0))return alert('Enter an amount');let {data:p,error}=await db.from('payments').insert({property_id:property.id,occupancy_id:oid,payment_date:pd.value,amount:amt,method:pm.value,reference:pr.value,created_by:user.id}).select().single();if(error)return alert(error.message);await db.rpc('allocate_payment_oldest_first',{p_payment:p.id});await db.from('invoices').insert({property_id:property.id,payment_id:p.id});modal='';await load()}
async function moveMonth(d){let [y,m]=month.split('-').map(Number),x=new Date(y,m-1+d,1);month=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');await load()}async function logout(){await db.auth.signOut();user=null;authView()}
boot();
</script></body></html>
